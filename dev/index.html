<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b11">
    <meta name="description" content="A real-time WebGPU candlestick chart built with Rust and WebAssembly.">
    <title>WebGPU Candles — Live Market Chart</title>
    <link rel="icon" type="image/svg+xml" href="res/favicon.svg">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            min-width: 320px;
            background: #080b11;
            color: #f4f7fb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #loading {
            display: flex;
            gap: 14px;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f4f7fb;
        }
        
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #263141;
            border-top-color: #8db4ff;
            border-radius: 50%;
            animation: spin 800ms linear infinite;
        }

        .loading-title {
            margin: 0;
            font-size: 15px;
            font-weight: 680;
        }

        .loading-caption {
            margin: 4px 0 0;
            color: #8d9aab;
            font-size: 12px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<link rel="modulepreload" href="/webgpu-candles/dev/price-chart-wasm.js" crossorigin="anonymous" integrity="sha384-rmU2Hp5pATC8uUoNOCxlejjybPZfmmV3G4Yz9GTxJmrs2l/vKiptfRC81+CFK9gl"><link rel="preload" href="/webgpu-candles/dev/price-chart-wasm_bg.wasm" crossorigin="anonymous" integrity="sha384-rEVMoYgbD8IuEyugtrHhAJYLKw5ZdfJQRWoM+glRHjYdBTaRfQdXOGPP2H+Y8o4H" as="fetch" type="application/wasm"></head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>
            <p class="loading-title">Starting WebGPU renderer</p>
            <p class="loading-caption">Connecting to live market data…</p>
        </div>
    </div>

    
<script type="module">
import init, * as bindings from '/webgpu-candles/dev/price-chart-wasm.js';
const wasm = await init({ module_or_path: '/webgpu-candles/dev/price-chart-wasm_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
</body>
</html>
