name: benchmark
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown
      - name: Read the locked WASM runner version
        id: bindgen
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path('Cargo.lock').read_text())['package']
          versions = {p['version'] for p in packages if p['name'] == 'wasm-bindgen'}
          assert len(versions) == 1, versions
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={versions.pop()}\n')
          PY
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
          fallback: none
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: '155.0.8059.79'
          install-chromedriver: true
      - name: Select fixed software WebGPU browser and record environment
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          TESTED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path
          path = Path('webdriver-perf.json')
          config = json.loads(path.read_text())
          config['goog:chromeOptions']['binary'] = os.environ['CHROME_BINARY']
          path.write_text(json.dumps(config))
          metadata = {
              'tested_sha': os.environ['TESTED_SHA'],
              'run_url': os.environ['RUN_URL'],
              'browser': subprocess.check_output([os.environ['CHROME_BINARY'], '--version'], text=True).strip(),
              'rust': subprocess.check_output(['rustc', '--version'], text=True).strip(),
              'os': platform.platform(),
              'cpu': platform.processor(),
              'backend': 'SwiftShader software WebGPU',
              'browser_flags': config['goog:chromeOptions']['args'],
          }
          Path('perf-environment.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Measure completed frames for each deterministic dataset
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          WASM_BINDGEN_TEST_ONLY_WEB: '1'
          WASM_BINDGEN_TEST_TIMEOUT: '180'
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: webdriver-perf.json
        run: |
          set -o pipefail
          cargo test --release --locked --features performance --test performance_limit -- --nocapture 2>&1 | tee perf.log
          python3 scripts/parse_perf_log.py perf.log benchmark_result.json
      - name: Reject per-workload throughput regressions
        run: python3 scripts/compare_fps.py benchmark_result.json DOCS/perf_baseline.json perf_result.json 30
      - name: Preserve measurements and environment, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: completed-frame-performance
          path: |
            perf.log
            perf-environment.json
            benchmark_result.json
            perf_result.json
          if-no-files-found: error
