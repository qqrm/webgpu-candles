name: benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Run benchmarks
        env:
          WASM_BINDGEN_TEST_BROWSER_ARGS: "--no-sandbox --enable-unsafe-webgpu"
        run: |
          set -o pipefail
          wasm-pack test --chrome --headless -- --locked | tee perf.log
          python scripts/parse_perf_log.py perf.log benchmark_result.json
      - name: Analyze FPS
        run: |
          python scripts/compare_fps.py benchmark_result.json DOCS/perf_baseline.json DOCS/perf_result.json 5
      - name: Update perf markdown
        run: |
          python - <<'EOF'
          import json, pathlib
          data = json.load(open('DOCS/perf_result.json'))
          lines = ['# Latest metrics', '', '| Metric | Value |', '| --- | --- |']
          for k, v in data.items():
              lines.append(f'| {k} | {v} |')
          pathlib.Path('DOCS/perf.md').write_text('\n'.join(lines) + '\n')
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf_results
          path: DOCS/perf_result.json
      - name: Send benchmark results to bot
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          scripts/send_to_bot.sh DOCS/perf_result.json "Benchmark results"
