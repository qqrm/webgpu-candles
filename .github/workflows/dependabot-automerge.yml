name: Dependabot Automerge

# workflow_run is intentional: no checkout, artifacts, or PR-controlled execution.
# The native gates and --match-head-commit bind the write to the checked commit.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI, Workflow Security]
    types: [completed]

# Metadata only: never check out PR code or consume its artifacts here.
permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the checked Dependabot commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo 'No associated pull request; nothing to merge.'
            exit 0
          fi
          info="$(gh pr view "$pr" --repo "$REPO" --json author,isCrossRepository,headRefOid,baseRefName,isDraft,state,mergeStateStatus,statusCheckRollup)"
          if ! jq -e --arg sha "$CHECKED_SHA" '
            (.author.login == "app/dependabot" or .author.login == "dependabot[bot]") and
            .isCrossRepository == false and .baseRefName == "main" and
            .state == "OPEN" and .isDraft == false and .headRefOid == $sha and
            .mergeStateStatus == "CLEAN" and
            (["ci-gate", "workflow-security-gate"] -
              [.statusCheckRollup[] | select(.status == "COMPLETED" and .conclusion == "SUCCESS") | .name] | length == 0) and
            all(.statusCheckRollup[];
              if .__typename == "CheckRun" then
                .status == "COMPLETED" and
                (.conclusion == "SUCCESS" or .conclusion == "NEUTRAL" or .conclusion == "SKIPPED")
              elif .__typename == "StatusContext" then .state == "SUCCESS"
              else false end)
          ' <<< "$info" >/dev/null; then
            echo 'The current Dependabot commit has not passed both required gates.'
            exit 0
          fi
          # Metadata only: an owner may adopt the PR, but only bot commits auto-merge.
          commits="$(gh api "repos/$REPO/pulls/$pr/commits?per_page=100" --paginate --slurp)"
          if ! jq -e --arg sha "$CHECKED_SHA" '
            add | length > 0 and .[-1].sha == $sha and
            all(.[]; .author.login == "dependabot[bot]" and
              .committer.login == "web-flow" and .commit.verification.verified == true and
              .commit.verification.reason == "valid")
          ' <<< "$commits" >/dev/null; then
            echo 'This batch is not exclusively signed by Dependabot; no automatic merge.'
            exit 0
          fi
          base_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          comparison="$(gh api "repos/$REPO/compare/$base_sha...$CHECKED_SHA")"
          if ! jq -e --arg base "$base_sha" '
            .behind_by == 0 and .merge_base_commit.sha == $base
          ' <<< "$comparison" >/dev/null; then
            echo 'The batch must refresh after main changed; no merge.'
            exit 0
          fi
          # Native protection rechecks gates and current base at the merge boundary.
          gh pr merge "$pr" --repo "$REPO" --squash \
            --match-head-commit "$CHECKED_SHA"
